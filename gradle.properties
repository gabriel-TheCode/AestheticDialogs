org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is left off until the screenshot and API-validation
# plugins are all verified against it; enable it with --configuration-cache to try.

android.useAndroidX=true
android.nonTransitiveRClass=true
# Jetifier rewrites legacy support-library artifacts. Nothing in this build needs it.
android.enableJetifier=false

kotlin.code.style=official

# --- Maven Central coordinates -------------------------------------------------
# Values are shared by the publication and by the POM. Overridden on CI by
# ORG_GRADLE_PROJECT_* environment variables for signing credentials.
GROUP=com.gabrielthecode
POM_ARTIFACT_ID=aestheticdialogs
VERSION_NAME=2.0.0

POM_NAME=AestheticDialogs
POM_DESCRIPTION=A Jetpack Compose dialog design system built on the three-layer UI architecture.
POM_INCEPTION_YEAR=2019
POM_URL=https://github.com/gabriel-TheCode/AestheticDialogs

SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/gabriel-TheCode/AestheticDialogs
POM_SCM_CONNECTION=scm:git:git://github.com/gabriel-TheCode/AestheticDialogs.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/gabriel-TheCode/AestheticDialogs.git

POM_DEVELOPER_ID=gabriel-TheCode
POM_DEVELOPER_NAME=Gabriel TEKOMBO
POM_DEVELOPER_URL=https://github.com/gabriel-TheCode
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=true
android.newDsl=false
